project.ext.envConfigFiles = [
    devdebug: ".env.dev",
    devrelease: ".env.dev",
    stagingdebug: ".env.staging",
    stagingrelease: ".env.staging",
    proddebug: ".env.prod",
    prodrelease: ".env.prod"
]

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "com.google.gms.google-services"

// --- APPLY DOTENV AFTER ANDROID PLUGINS ---
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 */
react {
    debuggableVariants = ["devDebug", "stagingDebug", "prodDebug"]
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.myapp"
    defaultConfig {
        applicationId "com.myapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resValue "string", "build_config_package", "com.myapp"
    }

    flavorDimensions "default"
    productFlavors {
        dev {
            dimension "default"
           
            resValue "string", "app_name", "TaskManager Dev"
        }
        staging {
            dimension "default"
       
            resValue "string", "app_name", "TaskManager Staging"
        }
        prod {
            dimension "default"
            resValue "string", "app_name", "TaskManager"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}